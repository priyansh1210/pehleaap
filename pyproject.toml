[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pehleaap"
version = "1.0.0"
description = "Turn-taking (end-of-turn, barge-in, backchannel, hold) for Hinglish 8 kHz telephony voice agents"
requires-python = ">=3.11"
license = { text = "BSD-2-Clause" }

[tool.setuptools.packages.find]
include = ["pehleaap*"]

[tool.ruff.lint]
# Bugs only (ruff's classic defaults): syntax errors, undefined names, unused imports and variables.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
